services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_APP_NAME: ${VITE_APP_NAME:-}
        APK_MIRROR: ${APK_MIRROR:-}
    container_name: ${STACK_PREFIX:-testcase}_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_BIND:-0.0.0.0}:${FRONTEND_HOST_PORT:-80}:80"
    # 勿用 service_healthy：后端迁移/配置失败时前端会永远不启动，整站 80 无响应。
    depends_on:
      backend:
        condition: service_started
    networks:
      - testcase_network

  # 后端服务
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APK_MIRROR: ${APK_MIRROR:-}
        # 生产默认安装 font-noto-cjk（PDF/Canvas 中文）；开发栈可在 override 中设为 0 以显著缩短首次构建
        INSTALL_CJK_FONTS: ${INSTALL_CJK_FONTS:-1}
    container_name: ${STACK_PREFIX:-testcase}_backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://testcase_user:testcase_pass@postgres:5432/testcase_db}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4/}
      - DEFAULT_AI_MODEL=${DEFAULT_AI_MODEL:-glm-4.5}
      - AI_DEFAULT_MAX_TOKENS=${AI_DEFAULT_MAX_TOKENS:-32768}
      - AI_MAX_OUTPUT_TOKENS=${AI_MAX_OUTPUT_TOKENS:-128000}
      - AI_CONTINUATION_MAX_ATTEMPTS=${AI_CONTINUATION_MAX_ATTEMPTS:-5}
      - STREAM_FULL_CONTENT_MAX_CHARS=${STREAM_FULL_CONTENT_MAX_CHARS:-2000000}
      - ANALYSIS_RECORD_MAX_CHARS=${ANALYSIS_RECORD_MAX_CHARS:-2000000}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MAIL_PROVIDER=${MAIL_PROVIDER:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-}
      - MAIL_SMTP_IPV4FIRST=${MAIL_SMTP_IPV4FIRST:-}
      - MAIL_TLS_SERVERNAME=${MAIL_TLS_SERVERNAME:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_CONNECTION_TIMEOUT_MS=${SMTP_CONNECTION_TIMEOUT_MS:-}
      - SMTP_SOCKET_TIMEOUT_MS=${SMTP_SOCKET_TIMEOUT_MS:-}
      - AUTH_ALLOW_PLAINTEXT_PASSWORD=${AUTH_ALLOW_PLAINTEXT_PASSWORD:-}
      - UPLOAD_DIR=${UPLOAD_DIR:-./uploads}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-10485760}
      - APP_PORT=${APP_PORT:-3000}
      - THROTTLE_TTL=${THROTTLE_TTL:-60}
      - THROTTLE_LIMIT=${THROTTLE_LIMIT:-100}
      - AUTH_ADMIN_ONLY=${AUTH_ADMIN_ONLY:-}
      - AUTH_REGISTER_INVITE_CODE=${AUTH_REGISTER_INVITE_CODE:-}
      # 不设则走后端默认（生产 30s / 非生产关闭）；显式 0=关闭
      - TEMPLATES_LIST_CACHE_TTL_MS=${TEMPLATES_LIST_CACHE_TTL_MS:-30000}
      - FILE_PARSE_WORKER_ENABLED=${FILE_PARSE_WORKER_ENABLED:-1}
      - FILE_PARSE_WORKER_INTERVAL_MS=${FILE_PARSE_WORKER_INTERVAL_MS:-1500}
      - FILE_PARSE_WORKER_MAX_CONCURRENT=${FILE_PARSE_WORKER_MAX_CONCURRENT:-}
      - FILE_PARSE_TIMEOUT_MINUTES=${FILE_PARSE_TIMEOUT_MINUTES:-15}
      - FILE_PARSE_FORCE_HUNYUAN=${FILE_PARSE_FORCE_HUNYUAN:-}
      - FILE_PARSE_TENCENT_OCR_FALLBACK=${FILE_PARSE_TENCENT_OCR_FALLBACK:-}
      - FILE_PARSE_LOCAL_OCR_FALLBACK=${FILE_PARSE_LOCAL_OCR_FALLBACK:-}
      - FILE_PARSE_PDF_FAST_MODE=${FILE_PARSE_PDF_FAST_MODE:-1}
      - FILE_PARSE_PDF_FAST_MAX_MB=${FILE_PARSE_PDF_FAST_MAX_MB:-10}
      - FILE_PARSE_PDF_FAST_MAX_PAGES=${FILE_PARSE_PDF_FAST_MAX_PAGES:-3}
      - FILE_PARSE_PDF_FAST_VISION_PAGES=${FILE_PARSE_PDF_FAST_VISION_PAGES:-3}
      - FILE_PARSE_PDF_HUNYUAN_FIRST=${FILE_PARSE_PDF_HUNYUAN_FIRST:-}
      # =1：PDF 按页渲染 PNG 再分批混元（避免整份 data:application/pdf Base64 触发 image download failed）；需镜像内 canvas/pdf 正常
      - FILE_PARSE_PDF_PAGED_VISION=${FILE_PARSE_PDF_PAGED_VISION:-}
      - VISION_PARSE_MODEL_CONFIG_ID=${VISION_PARSE_MODEL_CONFIG_ID:-}
      - VISION_PDF_MIN_TEXT_CHARS=${VISION_PDF_MIN_TEXT_CHARS:-120}
      - VISION_PDF_ALWAYS=${VISION_PDF_ALWAYS:-0}
      - VISION_PDF_RENDER_SCALE=${VISION_PDF_RENDER_SCALE:-1.2}
      - VISION_PDF_BATCH_PAGES=${VISION_PDF_BATCH_PAGES:-}
      - VISION_PDF_MAX_PAGES=${VISION_PDF_MAX_PAGES:-}
      - OCR_LANGS=${OCR_LANGS:-chi_sim+chi_tra+eng}
      - PDF_OCR_SKIP_VISION=${PDF_OCR_SKIP_VISION:-}
      - SKIP_PRISMA_MIGRATE_ON_START=${SKIP_PRISMA_MIGRATE_ON_START:-}
      - AUTO_ARCHIVE_IDLE_DAYS=${AUTO_ARCHIVE_IDLE_DAYS:-0}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - TEMPLATES_LIST_CACHE_REDIS=${TEMPLATES_LIST_CACHE_REDIS:-1}
      # 腾讯云 COS（可选）
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_REGION=${COS_REGION:-}
      - COS_PREFIX=${COS_PREFIX:-}
      - COS_PARSE_TEMP_DIR=${COS_PARSE_TEMP_DIR:-}
      # 混元 OpenAI 兼容多模态（https://api.hunyuan.cloud.tencent.com/v1/chat/completions，Bearer sk-）
      - HUNYUAN_MULTIMODAL_ENABLED=${HUNYUAN_MULTIMODAL_ENABLED:-}
      - HUNYUAN_VISION_API_KEY=${HUNYUAN_VISION_API_KEY:-}
      - HUNYUAN_OPENAI_API_KEY=${HUNYUAN_OPENAI_API_KEY:-}
      - HUNYUAN_OPENAI_BASE_URL=${HUNYUAN_OPENAI_BASE_URL:-}
      - HUNYUAN_OPENAI_TIMEOUT_MS=${HUNYUAN_OPENAI_TIMEOUT_MS:-}
      # 混元多模态直读 COS（解析阶段）
      - HUNYUAN_COS_MULTIMODAL_PARSE_ENABLED=${HUNYUAN_COS_MULTIMODAL_PARSE_ENABLED:-}
      - HUNYUAN_COS_URL_EXPIRES_SEC=${HUNYUAN_COS_URL_EXPIRES_SEC:-}
      - HUNYUAN_REGION=${HUNYUAN_REGION:-}
      - HUNYUAN_MULTIMODAL_MODEL=${HUNYUAN_MULTIMODAL_MODEL:-}
      - HUNYUAN_MULTIMODAL_TEMPERATURE=${HUNYUAN_MULTIMODAL_TEMPERATURE:-}
      - HUNYUAN_MULTIMODAL_REQ_TIMEOUT_SEC=${HUNYUAN_MULTIMODAL_REQ_TIMEOUT_SEC:-}
      - HUNYUAN_COS_MULTIMODAL_MAX_PDF_MB=${HUNYUAN_COS_MULTIMODAL_MAX_PDF_MB:-}
      - HUNYUAN_COS_MULTIMODAL_MAX_IMAGE_MB=${HUNYUAN_COS_MULTIMODAL_MAX_IMAGE_MB:-}
      - HUNYUAN_COS_MULTIMODAL_MIN_OUTPUT_CHARS=${HUNYUAN_COS_MULTIMODAL_MIN_OUTPUT_CHARS:-}
      - HUNYUAN_COS_MULTIMODAL_MIN_OUTPUT_CHARS_PDF=${HUNYUAN_COS_MULTIMODAL_MIN_OUTPUT_CHARS_PDF:-}
      - HUNYUAN_PARSE_FORCE_ONLY=${HUNYUAN_PARSE_FORCE_ONLY:-}
      # Multimodal 计费/并发（与 ghcr 栈一致；不设则代码内默认）
      - MM_ENABLED=${MM_ENABLED:-}
      - MM_DEFAULT_MODEL=${MM_DEFAULT_MODEL:-}
      - MM_TEXT_FALLBACK_MODEL=${MM_TEXT_FALLBACK_MODEL:-}
      - MM_MAX_CONCURRENT=${MM_MAX_CONCURRENT:-}
      - MM_CACHE_TTL_DAYS=${MM_CACHE_TTL_DAYS:-}
      - MM_MONTHLY_ALERT_CNY=${MM_MONTHLY_ALERT_CNY:-}
      - MM_AUTO_DOWNGRADE_WHEN_OVER_BUDGET=${MM_AUTO_DOWNGRADE_WHEN_OVER_BUDGET:-}
      - MM_PRICE_MULTIMODAL_INPUT_1K_CNY=${MM_PRICE_MULTIMODAL_INPUT_1K_CNY:-}
      - MM_PRICE_MULTIMODAL_OUTPUT_1K_CNY=${MM_PRICE_MULTIMODAL_OUTPUT_1K_CNY:-}
      - MM_PRICE_TEXT_INPUT_1K_CNY=${MM_PRICE_TEXT_INPUT_1K_CNY:-}
      - MM_PRICE_TEXT_OUTPUT_1K_CNY=${MM_PRICE_TEXT_OUTPUT_1K_CNY:-}
      # 腾讯云 OCR（HTTP / SDK PDF）与 PDF 文本层调参
      - TENCENT_OCR_HTTP_URL=${TENCENT_OCR_HTTP_URL:-}
      - TENCENT_OCR_HTTP_TIMEOUT_MS=${TENCENT_OCR_HTTP_TIMEOUT_MS:-}
      - TENCENTCLOUD_SECRET_ID=${TENCENTCLOUD_SECRET_ID:-}
      - TENCENTCLOUD_SECRET_KEY=${TENCENTCLOUD_SECRET_KEY:-}
      - TENCENT_OCR_REGION=${TENCENT_OCR_REGION:-}
      - TENCENT_OCR_COS_URL_EXPIRES_SEC=${TENCENT_OCR_COS_URL_EXPIRES_SEC:-}
      - PDF_TENCENT_OCR_ENABLED=${PDF_TENCENT_OCR_ENABLED:-}
      - PDF_TENCENT_OCR_PAGE_RETRIES=${PDF_TENCENT_OCR_PAGE_RETRIES:-}
      - PDF_TENCENT_SDK_PDF=${PDF_TENCENT_SDK_PDF:-}
      - PDF_TENCENT_SDK_MAX_BYTES=${PDF_TENCENT_SDK_MAX_BYTES:-}
      - PDF_TENCENT_SDK_MAX_PROBE_PAGES=${PDF_TENCENT_SDK_MAX_PROBE_PAGES:-}
      - PDF_TEXT_GARBLED_RATIO_MAX=${PDF_TEXT_GARBLED_RATIO_MAX:-}
      - PDF_OCR_BATCH_SIZE=${PDF_OCR_BATCH_SIZE:-}
      - PDF_OCR_MAX_CONCURRENT_BATCHES=${PDF_OCR_MAX_CONCURRENT_BATCHES:-}
      - PDF_OCR_SHARD_RETRIES=${PDF_OCR_SHARD_RETRIES:-}
      - PDF_OCR_SHARD_RETRY_DELAY_MS=${PDF_OCR_SHARD_RETRY_DELAY_MS:-}
      - PDF_INCREMENTAL_THRESHOLD_PAGES=${PDF_INCREMENTAL_THRESHOLD_PAGES:-}
      - PDF_INCREMENTAL_SNAPSHOT_PAGES=${PDF_INCREMENTAL_SNAPSHOT_PAGES:-}
      - VISION_API_TIMEOUT_MS=${VISION_API_TIMEOUT_MS:-}
      - VISION_IMAGE_TIMEOUT_MS=${VISION_IMAGE_TIMEOUT_MS:-}
      - VISION_IMAGE_DETAIL=${VISION_IMAGE_DETAIL:-}
      - IMAGE_OCR_MAX_WIDTH=${IMAGE_OCR_MAX_WIDTH:-}
      - IMAGE_OCR_JPEG_QUALITY=${IMAGE_OCR_JPEG_QUALITY:-}
      - IMAGE_OCR_MAX_OUTPUT_BYTES=${IMAGE_OCR_MAX_OUTPUT_BYTES:-}
      - IMAGE_OCR_CHUNK_MAX_HEIGHT=${IMAGE_OCR_CHUNK_MAX_HEIGHT:-}
      - IMAGE_OCR_MAX_CONCURRENT=${IMAGE_OCR_MAX_CONCURRENT:-}
      - IMAGE_OCR_WORKER_POOL=${IMAGE_OCR_WORKER_POOL:-}
      - IMAGE_OCR_AUTO_RETRIES=${IMAGE_OCR_AUTO_RETRIES:-}
      - IMAGE_OCR_CACHE_ENABLED=${IMAGE_OCR_CACHE_ENABLED:-}
      - IMAGE_OCR_CACHE_TTL_DAYS=${IMAGE_OCR_CACHE_TTL_DAYS:-}
      - IMAGE_OCR_CACHE_SWEEP_MS=${IMAGE_OCR_CACHE_SWEEP_MS:-}
      - IMAGE_OCR_WARMUP=${IMAGE_OCR_WARMUP:-}
      - IMAGE_OCR_TIMEOUT_MS=${IMAGE_OCR_TIMEOUT_MS:-}
      - IMAGE_PARSE_SKIP_OCR_WHEN_VISION_OK=${IMAGE_PARSE_SKIP_OCR_WHEN_VISION_OK:-}
      - STRUCTURE_LLM_FOR_VISION_DOC=${STRUCTURE_LLM_FOR_VISION_DOC:-}
      - ANALYZE_STREAM_HUNYUAN_WHEN_PARSED=${ANALYZE_STREAM_HUNYUAN_WHEN_PARSED:-}
      - PADDLE_OCR_SERVICE_URL=${PADDLE_OCR_SERVICE_URL:-}
      - PADDLE_OCR_TIMEOUT_MS=${PADDLE_OCR_TIMEOUT_MS:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "require(''http'').get(''http://127.0.0.1:3000/health'',(r)=>process.exit(r.statusCode===200?0:1)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 180s
    networks:
      - testcase_network

  # 数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: ${STACK_PREFIX:-testcase}_postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-testcase_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-testcase_pass}
      POSTGRES_DB: ${DB_NAME:-testcase_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-testcase_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - testcase_network

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ${STACK_PREFIX:-testcase}_redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - testcase_network

volumes:
  postgres_data:
  redis_data:

networks:
  testcase_network:
    driver: bridge
