# -----------------------------------------------------------------------------
# 腾讯云 CNB（cnb.cool）云原生构建 — VPS 部署（1本仓库默认唯一自动部署入口）
#
# 推送 main / develop 时触发；脚本路径 scripts/ci/cnb-deploy-vps.sh（顺序构建前端、
# 推送 GHCR 镜像、可选同步国内容器镜像仓、rsync、远端 docker compose）。
#
# 镜像仓库（二选一，脚本自动判断）：
#   A) 不配 GHCR：在 CNB 云原生构建内由平台注入 CNB_TOKEN + CNB_DOCKER_REGISTRY，推送到
#      docker.cnb.cool/<仓库路径>/backend|frontend:<sha>；VPS 拉取需 docker login，默认传流水线
#      CNB_TOKEN，可选密钥 CNB_REGISTRY_PULL_TOKEN（长期只读令牌）。
#   B) 配 GHCR：密钥 GHCR_PUSH_TOKEN + GHCR_LOGIN_USER（GitHub PAT write:packages）；可选变量
#      GHCR_REPO_LOWER=owner/repo（小写）。VPS 拉私有 GHCR 时用 GHCR_PULL_TOKEN。
#
# 建议在 CNB「密钥仓库」或仓库密钥中配置：
#   — SSH_HOST, SSH_USER, SSH_KEY [, SSH_PORT]
#   — [, GHCR_PUSH_TOKEN, GHCR_LOGIN_USER] [, GHCR_PULL_TOKEN]
#   — [, CNB_REGISTRY_PULL_TOKEN]（VPS 拉 CNB 制品库时可选，优于把流水线 CNB_TOKEN 传到机器）
#   — [, CONTAINER_MIRROR_*]（DEPLOY_PULL_FROM_MIRROR=true 时）
#
# 仓库变量（可选）：
#   — DEPLOY_PATH, DEV_DEPLOY_PATH — 与 GitHub Actions Variables 相同
#   — DEPLOY_REGION, APK_MIRROR, VITE_API_BASE_URL, VITE_APP_NAME
#   — DEPLOY_PULL_FROM_MIRROR, CONTAINER_MIRROR_IMAGE_PREFIX, MIRROR_STEP_TIMEOUT_MIN
#
# 代码迁入：可用官方迁移工具（示例）
#   docker run --rm -e PLUGIN_SOURCE_TOKEN -e PLUGIN_CNB_TOKEN ... cnbcool/code-import
#   详见 https://docs.cnb.cool 与社区「CNB 迁移」说明。
# -----------------------------------------------------------------------------

# 同时引用两个环境的密钥（权限自动隔离）
