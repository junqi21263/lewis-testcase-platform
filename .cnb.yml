# -----------------------------------------------------------------------------
# 腾讯云 CNB（cnb.cool）云原生构建 — VPS 部署（本仓库默认唯一自动部署入口）
#
# 推送 main / develop 时触发；脚本路径 scripts/ci/cnb-deploy-vps.sh（顺序构建前端、
# 推送 GHCR 镜像、可选同步国内容器镜像仓、rsync、远端 docker compose）。
#
# 仍使用 ghcr.io/<仓库>/backend|frontend:<sha>：需在 GitHub 创建 PAT（write:packages），
# 并填入下方密钥；若 CNB 仓库 slug 与 GitHub 不一致，请设置变量 GHCR_REPO_LOWER=owner/repo（小写）。
#
# 建议在 CNB「密钥仓库」或仓库密钥中配置（与 GitHub Actions 对齐便于迁移）：
#   — SSH_HOST, SSH_USER, SSH_KEY [, SSH_PORT]
#   — GHCR_PUSH_TOKEN（GitHub PAT，推送镜像）, GHCR_LOGIN_USER（GitHub 用户名）
#   — [, GHCR_PULL_TOKEN]（VPS 拉私有 GHCR 时使用）
#   — [, CONTAINER_MIRROR_REGISTRY, USERNAME, PASSWORD]（DEPLOY_PULL_FROM_MIRROR=true 时）
#
# 仓库变量（可选）：
#   — DEPLOY_PATH, DEV_DEPLOY_PATH — 与 GitHub Actions Variables 相同
#   — DEPLOY_REGION, APK_MIRROR, VITE_API_BASE_URL, VITE_APP_NAME
#   — DEPLOY_PULL_FROM_MIRROR, CONTAINER_MIRROR_IMAGE_PREFIX, MIRROR_STEP_TIMEOUT_MIN
#
# 代码迁入：可用官方迁移工具（示例）
#   docker run --rm -e PLUGIN_SOURCE_TOKEN -e PLUGIN_CNB_TOKEN ... cnbcool/code-import
#   详见 https://docs.cnb.cool 与社区「CNB 迁移」说明。
# -----------------------------------------------------------------------------
develop:
  push:
    - name: deploy-vps
      docker:
        image: node:20-bookworm
      services:
        - docker
      stages:
        - name: deploy
          script: bash scripts/ci/cnb-deploy-vps.sh

main:
  push:
    - name: deploy-vps
      docker:
        image: node:20-bookworm
      services:
        - docker
      stages:
        - name: deploy
          script: bash scripts/ci/cnb-deploy-vps.sh
