# -----------------------------------------------------------------------------
# 腾讯云 CNB（cnb.cool）云原生构建 — 前后端镜像构建 + SSH 部署同一流水线内顺序执行。
#
# 分支策略（见 https://docs.cnb.cool/zh/build/trigger-rule.html ）：
# — 顶层键名 = 触发分支；push 到 develop 时仅使用「当前分支上的」.cnb.yml 里与 develop 匹配的块。
# — 因此 develop / main 各自一条流水线；勿仅写在 main: 下用 branches 过滤，否则 develop 推送不会按预期触发。
#
# 推荐流程：先 push 到 develop（本文件含 develop:）验证前后端一体部署；确认无误后再合并到 main 触发生产。
#
# 制品库：构建阶段 source cnb-registry-env.sh 后在 Runner 上 docker login 再 push；部署阶段见 cnb-vps-remote-deploy.sh。
# 前端镜像：docker build 的 context 必须为目录 frontend（-f frontend/Dockerfile frontend）；根目录
#   .dockerignore 会排除 frontend/，若用 context=. 则 COPY nginx.conf.template 等会报 not found。
# 密钥：写在各流水线的 imports 下。远端部署见 scripts/ci/cnb-vps-remote-deploy.sh（stdin 传令牌登录，
#   避免令牌经 ssh 远程字符串转义失败）。
# -----------------------------------------------------------------------------

# =============================================================================
# develop：开发环境（先在此分支验证）
# =============================================================================
develop:
  push:
    - name: vps-docker-deploy-dev
      imports:
        - https://cnb.cool/lewis-test/secrets/-/blob/main/vps-dev-secret.yml
      runner:
        cpus: 8
      docker:
        image: docker:26-cli
      services:
        - docker:dind
      env:
        CNB_DOCKER_REGISTRY: docker.cnb.cool/lewis-test/lewis-testcase-platform
        ENVIRONMENT: development
        IMAGE_TAG: dev
        INSTALL_CJK_FONTS: "0"
        # 可选（CNB 仓库变量）：CNB_FRONTEND_DEV_HOST_PORT、CNB_BACKEND_DEV_HOST_PORT、CNB_BACKEND_EXTRA_NETWORKS — 见 scripts/ci/cnb-vps-remote-deploy.sh
      stages:
        - name: 构建后端开发镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建后端开发镜像 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"
              docker build \
                --build-arg "INSTALL_CJK_FONTS=${INSTALL_CJK_FONTS:-1}" \
                --build-arg "APK_MIRROR=${APK_MIRROR:-}" \
                -t "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}" -f backend/Dockerfile .
              docker push "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"

        - name: 构建前端开发镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建前端开发镜像 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"
              docker build \
                --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}" \
                --build-arg "VITE_APP_NAME=${VITE_APP_NAME:-}" \
                --build-arg "APK_MIRROR=${APK_MIRROR:-}" \
                -t "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend
              docker push "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"

        - name: 部署后端到开发服务器
          script:
            - |
              set -eu
              DEPLOY_FLAVOR=backend-dev sh ./scripts/ci/cnb-vps-remote-deploy.sh

        - name: 部署前端到开发服务器
          script:
            - |
              set -eu
              DEPLOY_FLAVOR=frontend-dev sh ./scripts/ci/cnb-vps-remote-deploy.sh

# =============================================================================
# main：生产环境（develop 验证通过后再合并至此分支触发）
# =============================================================================
main:
  push:
    - name: vps-docker-deploy-prod
      imports:
        - https://cnb.cool/lewis-test/secrets/-/blob/main/vps-prod-secret.yml
      runner:
        cpus: 8
      docker:
        image: docker:26-cli
      services:
        - docker:dind
      env:
        CNB_DOCKER_REGISTRY: docker.cnb.cool/lewis-test/lewis-testcase-platform
        ENVIRONMENT: production
        IMAGE_TAG: latest
        INSTALL_CJK_FONTS: "1"
        # 生产端口、拉制品令牌、DEPLOY_BACKEND_ENV_FILE、CNB_BACKEND_EXTRA_NETWORKS、SSH 等可写在 imports 的 vps-prod-secret.yml
        # 若宿主机 80 已被系统 Nginx/Apache 占用，在密钥或变量设 CNB_FRONTEND_PROD_HOST_PORT（如 8080）
        # 可选：CNB_FRONTEND_PROD_HOST_PORT、CNB_BACKEND_PROD_HOST_PORT — 默认 80 / 8081
      stages:
        - name: 构建后端生产镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建后端生产镜像 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"
              docker build \
                --build-arg "INSTALL_CJK_FONTS=${INSTALL_CJK_FONTS:-1}" \
                --build-arg "APK_MIRROR=${APK_MIRROR:-}" \
                -t "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}" -f backend/Dockerfile .
              docker push "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"

        - name: 构建前端生产镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建前端生产镜像 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"
              docker build \
                --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}" \
                --build-arg "VITE_APP_NAME=${VITE_APP_NAME:-}" \
                --build-arg "APK_MIRROR=${APK_MIRROR:-}" \
                -t "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend
              docker push "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"

        - name: 部署后端到生产服务器
          script:
            - |
              set -eu
              DEPLOY_FLAVOR=backend-prod sh ./scripts/ci/cnb-vps-remote-deploy.sh

        - name: 部署前端到生产服务器
          script:
            - |
              set -eu
              DEPLOY_FLAVOR=frontend-prod sh ./scripts/ci/cnb-vps-remote-deploy.sh
