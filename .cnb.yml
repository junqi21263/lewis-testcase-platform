# -----------------------------------------------------------------------------
# 腾讯云 CNB（cnb.cool）云原生构建 — 前后端镜像构建 + SSH 部署同一流水线内顺序执行。
#
# 分支策略（见 https://docs.cnb.cool/zh/build/trigger-rule.html ）：
# — 顶层键名 = 触发分支；push 到 develop 时仅使用「当前分支上的」.cnb.yml 里与 develop 匹配的块。
# — 因此 develop / main 各自一条流水线；勿仅写在 main: 下用 branches 过滤，否则 develop 推送不会按预期触发。
#
# 推荐流程：先 push 到 develop（本文件含 develop:）验证前后端一体部署；确认无误后再合并到 main 触发生产。
#
# 制品库：scripts/ci/cnb-registry-env.sh 解析 REGISTRY_PREFIX，并在有 CNB_TOKEN 时 docker login。
# 前端镜像：docker build 的 context 必须为目录 frontend（-f frontend/Dockerfile frontend）；根目录
#   .dockerignore 会排除 frontend/，若用 context=. 则 COPY nginx.conf.template 等会报 not found。
# 密钥：imports（如 vps-dev-secret.yml）。开发部署可用 DEV_SSH_HOST / DEV_SSH_USER / DEV_SSH_KEY
#   （或通用 SSH_*）；见 scripts/ci/cnb-require-ssh-deploy-env.sh。详述见 docs/cnb-migration.md 第 3 节。
# -----------------------------------------------------------------------------

imports:
  - https://cnb.cool/lewis-test/secrets/-/blob/main/vps-prod-secret.yml
  - https://cnb.cool/lewis-test/secrets/-/blob/main/vps-dev-secret.yml

# =============================================================================
# develop：开发环境（先在此分支验证）
# =============================================================================
develop:
  push:
    - name: vps-docker-deploy-dev
      runner:
        cpus: 8
      docker:
        image: docker:26-cli
      services:
        - docker:dind
      env:
        CNB_DOCKER_REGISTRY: docker.cnb.cool/lewis-test/lewis-testcase-platform
        ENVIRONMENT: development
        IMAGE_TAG: dev
      stages:
        - name: 构建后端开发镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建后端开发镜像 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"
              docker build -t "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}" -f backend/Dockerfile .
              docker push "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"

        - name: 构建前端开发镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建前端开发镜像 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"
              docker build -t "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend
              docker push "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"

        - name: 部署后端到开发服务器
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-require-ssh-deploy-env.sh
              . ./scripts/ci/cnb-registry-env.sh
              printf '%s\n' "${SSH_KEY}" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
              ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
                  docker pull ${REGISTRY_PREFIX}/backend:${IMAGE_TAG} &&
                  docker stop your-app-backend-dev || true &&
                  docker rm your-app-backend-dev || true &&
                  docker run -d --name your-app-backend-dev --restart=always -p 8081:80 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG} &&
                  docker system prune -af
                "

        - name: 部署前端到开发服务器
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-require-ssh-deploy-env.sh
              . ./scripts/ci/cnb-registry-env.sh
              printf '%s\n' "${SSH_KEY}" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
              ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
                  docker pull ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG} &&
                  docker stop your-app-frontend-dev || true &&
                  docker rm your-app-frontend-dev || true &&
                  docker run -d --name your-app-frontend-dev --restart=always -p 8080:80 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG} &&
                  docker system prune -af
                "

# =============================================================================
# main：生产环境（develop 验证通过后再合并至此分支触发）
# =============================================================================
main:
  push:
    - name: vps-docker-deploy-prod
      runner:
        cpus: 8
      docker:
        image: docker:26-cli
      services:
        - docker:dind
      env:
        CNB_DOCKER_REGISTRY: docker.cnb.cool/lewis-test/lewis-testcase-platform
        ENVIRONMENT: production
        IMAGE_TAG: latest
      stages:
        - name: 构建后端生产镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建后端生产镜像 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"
              docker build -t "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}" -f backend/Dockerfile .
              docker push "${REGISTRY_PREFIX}/backend:${IMAGE_TAG}"

        - name: 构建前端生产镜像
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-registry-env.sh
              echo "开始构建前端生产镜像 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"
              docker build -t "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}" -f frontend/Dockerfile frontend
              docker push "${REGISTRY_PREFIX}/frontend:${IMAGE_TAG}"

        - name: 部署后端到生产服务器
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-require-ssh-deploy-env.sh
              . ./scripts/ci/cnb-registry-env.sh
              printf '%s\n' "${SSH_KEY}" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
              ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
                  docker pull ${REGISTRY_PREFIX}/backend:${IMAGE_TAG} &&
                  docker stop your-app-backend-prod || true &&
                  docker rm your-app-backend-prod || true &&
                  docker run -d --name your-app-backend-prod --restart=always -p 8081:80 ${REGISTRY_PREFIX}/backend:${IMAGE_TAG} &&
                  docker system prune -af
                "

        - name: 部署前端到生产服务器
          script:
            - |
              set -eu
              . ./scripts/ci/cnb-require-ssh-deploy-env.sh
              . ./scripts/ci/cnb-registry-env.sh
              printf '%s\n' "${SSH_KEY}" > /tmp/ssh_key && chmod 600 /tmp/ssh_key
              ssh -o StrictHostKeyChecking=no -i /tmp/ssh_key -p "${SSH_PORT}" "${SSH_USER}@${SSH_HOST}" "
                  docker pull ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG} &&
                  docker stop your-app-frontend-prod || true &&
                  docker rm your-app-frontend-prod || true &&
                  docker run -d --name your-app-frontend-prod --restart=always -p 80:80 ${REGISTRY_PREFIX}/frontend:${IMAGE_TAG} &&
                  docker system prune -af
                "
